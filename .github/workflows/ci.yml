# ══════════════════════════════════════════════════════════════════════════════
#  ADM — CI & Release Pipeline  (Windows x86-64 only)
#
#  Trigger matrix:
#    push → main / master / develop  ➜  lint + test
#    pull_request → same branches     ➜  lint + test
#    push → v* tag                    ➜  lint + test → release build → publish
#    PR by dependabot[bot]            ➜  lint + test → auto-merge
# ══════════════════════════════════════════════════════════════════════════════
name: CI & Release

on:
  push:
    branches: [main, master, develop]
    tags:      ['v*']
  pull_request:
    branches: [main, master, develop]

# Cancel any in-flight run for the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared defaults ───────────────────────────────────────────────────────────
env:
  CARGO_TERM_COLOR:          always
  RUST_BACKTRACE:            1
  # sccache remote cache — set these secrets in your repo settings
  # SCCACHE_GHA_ENABLED:     true          (set as repo secret / var)
  # RUSTC_WRAPPER:           sccache       (set as repo secret / var)

  # Tune the linker for faster incremental builds on Windows
  CARGO_INCREMENTAL:         0             # disabled in CI (sccache replaces it)
  CARGO_PROFILE_TEST_DEBUG:  0             # no debug info in test binaries

  # Rustflags forwarded from .cargo/config.toml
  # (reqwest_unstable already set there; keep in sync if you add more)

permissions:
  contents:      write
  pull-requests: write

# ══════════════════════════════════════════════════════════════════════════════
jobs:

# ── 1. Lint ───────────────────────────────────────────────────────────────────
#  Fast, cheap checks that give signal in < 3 min.
#  Runs on ubuntu to avoid Windows overhead for pure text/metadata checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo registry cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        # Cross-compile check only — no linker needed for --message-format
        run: >
          cargo clippy
          --workspace --all-targets
          --target x86_64-pc-windows-msvc
          --message-format=json
          -- -D warnings
        env:
          # Suppress linker errors during cross-check
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: "true"

      - name: cargo deny (licenses / advisories / bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans

# ── 2. Test ───────────────────────────────────────────────────────────────────
#  Full compile + test on the real target OS.
  test:
    name: Test (Windows x86-64)
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        # components not needed here; lint job already checked fmt/clippy

      # ── Compiler cache (sccache) ────────────────────────────────────────────
      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.7
        with:
          version: v0.9.1

      - name: Configure sccache as rustc wrapper
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache"   >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # ── Cargo registry + build artifact cache ──────────────────────────────
      - name: Restore Cargo + build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key:      test-windows
          cache-all-crates: true
          # Don't cache target/ directly — sccache handles compiled objects;
          # rust-cache keeps the registry index and downloaded sources.

      # ── Build ───────────────────────────────────────────────────────────────
      - name: cargo check (fast pre-flight)
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets
        env:
          # Use nextest if available in the runner image; fall back gracefully.
          CARGO_TEST_FLAGS: "--no-fail-fast"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

# ── 3. Dependabot auto-merge ──────────────────────────────────────────────────
  dependabot-automerge:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event_name == 'pull_request'
    needs: test

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL:       ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL:       ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── 4. Release build ──────────────────────────────────────────────────────────
  build-release:
    name: Release Build (Windows x86-64)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # sccache is especially valuable here: release builds take 2-3× longer
      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.7
        with:
          version: v0.9.1

      - name: Configure sccache as rustc wrapper
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache"    >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Restore Cargo + build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key:      release-windows
          cache-all-crates: true

      # ── Optimised build ─────────────────────────────────────────────────────
      # Use a dedicated "dist" profile so we don't thrash the test cache.
      - name: cargo build --profile dist
        run: cargo build --profile dist --workspace
        env:
          # lto=fat + codegen-units=1 are already set in Cargo.toml [profile.release].
          # The dist profile (defined below in Cargo.toml) inherits release and
          # adds strip=symbols. Nothing extra needed here.
          CARGO_PROFILE_DIST_INHERITS: release

      # ── Optional UPX compression ────────────────────────────────────────────
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Compress binaries with UPX
        shell: bash
        run: |
          for bin in \
            target/dist/adm-daemon.exe \
            target/dist/adm-server.exe \
            target/dist/adm-native-host.exe; do
            [ -f "$bin" ] && upx --best --lzma "$bin" || true
          done

      # ── Stage release artefacts ─────────────────────────────────────────────
      - name: Stage artefacts
        shell: bash
        run: |
          mkdir -p dist
          for bin in \
            adm-daemon \
            adm-server \
            adm-native-host \
            desktop-ui; do
            src="target/dist/${bin}.exe"
            [ -f "$src" ] && cp "$src" "dist/${bin}-windows-x86_64.exe" || true
          done
          # Also bundle the installer script if it exists
          [ -f installer/APEX_Setup.iss ] && cp installer/APEX_Setup.iss dist/ || true

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name:            adm-windows-x86_64-${{ github.ref_name }}
          path:            dist/
          retention-days:  14
          compression-level: 9

      - name: sccache stats
        if: always()
        run: sccache --show-stats

# ── 5. Publish GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release

    steps:
      - uses: actions/checkout@v4   # needed for release-notes generation

      - name: Download release artefacts
        uses: actions/download-artifact@v4
        with:
          name: adm-windows-x86_64-${{ github.ref_name }}
          path: dist

      - name: Generate checksums (SHA-256)
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files:                  dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
